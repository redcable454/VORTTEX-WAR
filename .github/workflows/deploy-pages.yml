name: Deploy VORTTEX WAR to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate game scripts and markup
        run: |
          node --check game.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  value = dict(attrs).get("id")
                  if value:
                      self.ids.append(value)
          parser = Check()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          duplicates = sorted({value for value in parser.ids if parser.ids.count(value) > 1})
          if duplicates:
              raise SystemExit("Duplicated HTML IDs: " + ", ".join(duplicates))
          required = {"world", "moveStick", "stickKnob", "pause", "back", "play"}
          missing = sorted(required - set(parser.ids))
          if missing:
              raise SystemExit("Missing required game elements: " + ", ".join(missing))
          print(f"HTML OK: {len(parser.ids)} unique IDs; required game controls found.")
          import re
          js = Path("game.js").read_text(encoding="utf-8")
          refs = set(re.findall(r"\\$\\(['\\\"]([^'\\\"]+)['\\\"]\\)", js))
          missing_refs = sorted(refs - set(parser.ids))
          if missing_refs:
              raise SystemExit("JavaScript references missing HTML IDs: " + ", ".join(missing_refs))
          css = re.sub(r"/\\*.*?\\*/", "", Path("style.css").read_text(encoding="utf-8"), flags=re.S)
          if css.count("{") != css.count("}"):
              raise SystemExit("Unbalanced CSS braces")
          if "linear-gradien(" in css:
              raise SystemExit("Malformed linear-gradient declaration found")
          print(f"JavaScript OK: {len(refs)} DOM IDs resolve; CSS braces balanced.")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Remove stale Pages artifacts from previous attempts
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              name: 'github-pages',
            });
            for (const artifact of data.artifacts) {
              core.info(`Deleting stale Pages artifact ${artifact.id}`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Wait for Pages artifact to become available
        run: sleep 15
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
